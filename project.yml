# XcodeGen spec: `xcodegen generate` writes Kinwall.xcodeproj (not committed).
# Signing: pass DEVELOPMENT_TEAM on the command line (scripts/testflight.sh does), or pick the team in Xcode.
name: Kinwall
options:
  bundleIdPrefix: family.kinwall
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "11"
    CODE_SIGN_STYLE: Automatic
packages:
  KinwallKit:
    path: KinwallKit
targets:
  Kinwall:
    type: application
    platform: iOS
    sources: [App/iOS]
    dependencies:
      - package: KinwallKit
      - sdk: AppIntents.framework # so Xcode extracts the Siri/Shortcuts metadata
      - target: KinwallWidgets
      - target: KinwallWatch
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Kinwall
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        ITSAppUsesNonExemptEncryption: false # HTTPS only: no export-compliance question per upload
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: family.kinwall.app
            CFBundleURLSchemes: [family.kinwall.app]
        UIBackgroundModes: [fetch] # background refresh keeps event reminders scheduled
        BGTaskSchedulerPermittedIdentifiers: [family.kinwall.app.reminders]
        NSLocalNetworkUsageDescription: Kinwall connects to your family's Kinwall server when it runs on your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # a self-hosted server on the home network, often plain http
          NSAllowsArbitraryLoadsInWebContent: true # the web view may load a self-hosted http address
    entitlements:
      path: App/iOS/Kinwall.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)family.kinwall.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.kinwall.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KinwallWidgets:
    type: app-extension
    platform: iOS
    sources: [App/Widgets]
    dependencies:
      - package: KinwallKit
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Kinwall
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/Widgets/KinwallWidgets.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)family.kinwall.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.kinwall.app.widgets
  KinwallWatch:
    type: application
    platform: watchOS
    sources: [App/Watch]
    dependencies:
      - package: KinwallKit
      - target: KinwallWatchWidgets
    info:
      path: App/Watch/Info.plist
      properties:
        CFBundleDisplayName: Kinwall
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: family.kinwall.app
    entitlements:
      path: App/Watch/KinwallWatch.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)family.kinwall.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.kinwall.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KinwallWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [App/WatchWidgets]
    dependencies:
      - package: KinwallKit
    info:
      path: App/WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Kinwall
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/WatchWidgets/KinwallWatchWidgets.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)family.kinwall.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.kinwall.app.watchkitapp.complications
